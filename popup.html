<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; font: 14px system-ui, sans-serif; margin: 0; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px; margin-bottom: 8px; border: 0; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #scrape { background: #2563eb; color: #fff; }
  #open { background: #e5e7eb; }
  #status { font-size: 12px; color: #555; min-height: 16px; }
  #status.err { color: #b91c1c; }
</style>
</head>
<body>
  <h1>Pedago Attendance</h1>
  <button id="scrape">Scrape this page &amp; open dashboard</button>
  <button id="open">Open last scraped data</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
